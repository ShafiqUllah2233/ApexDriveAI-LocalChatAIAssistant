services:
  - type: web
    name: apex-drive-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LLM_MODEL
        value: gpt-4o-mini
